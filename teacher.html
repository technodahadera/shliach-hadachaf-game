<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2545">
<title>שליח הדחף – מסך המורה</title>
<meta name="description" content="מסך המורה של המשחק שליח הדחף: קוד כיתה, QR, התקדמות התלמידים בזמן אמת וטבלת מובילים.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/Rubik.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="t-wrap">
  <header class="t-top">
    <div class="brand"><span class="logo" aria-hidden="true">⚡</span><span>שליח הדחף</span><span class="muted" style="font-weight:500;font-size:1.1rem">· מסך המורה</span></div>
    <div class="t-actions">
      <span class="chip-pts" id="tCount" hidden></span>
      <button class="btn" id="btnStart" hidden>התחלת המשחק ▶</button>
      <button class="btn ghostbtn" id="btnEnd" hidden>סיום משחק</button>
      <button class="btn ghostbtn" id="btnNew" hidden>משחק חדש</button>
    </div>
  </header>
  <main>
    <section class="t-home" id="t-home">
      <div>
        <div class="big-emoji" aria-hidden="true">🧠⚡💪</div>
        <h1>שליח הדחף</h1>
        <p class="muted" style="font-size:1.3rem">משחק כיתתי על מבנה הנוירון. התלמידים מצטרפים מהטלפון עם קוד.</p>
        <button class="btn" id="btnCreate" style="font-size:1.5rem;margin-top:1rem">פתיחת משחק חדש</button>
        <p class="err" id="homeErr" style="color:#ffb0b0"></p>
      </div>
    </section>

    <section id="t-lobby" hidden>
      <div class="lobby">
        <div class="card join-card">
          <p style="font-weight:800;font-size:1.4rem;margin:0 0 .6rem">סרקו כדי להצטרף</p>
          <div class="qr" id="qrBig"></div>
          <p style="margin:.8rem 0 0;font-weight:700">או היכנסו לכתובת והקלידו את הקוד:</p>
          <p class="join-url" id="joinUrl"></p>
          <div class="code-huge" id="codeBig">----</div>
        </div>
        <div>
          <p class="count-big" id="lobbyCount">0 תלמידים הצטרפו</p>
          <p class="muted" style="margin-top:-.6rem">לחיצה על שם מוציאה אותו מהמשחק.</p>
          <div class="names" id="names"></div>
        </div>
      </div>
    </section>

    <section id="t-play" hidden>
      <div class="t-play">
        <div>
          <div class="stats-mini">
            <div class="stat"><b id="stS1">0</b>🧩 שלב 1</div>
            <div class="stat"><b id="stS2">0</b>⚡ שלב 2</div>
            <div class="stat"><b id="stS3">0</b>🩹 שלב 3 · ✅ <span id="stDone">0</span></div>
          </div>
          <div class="grid" id="grid"></div>
        </div>
        <aside class="board">
          <h2>🏆 טבלת המובילים</h2>
          <ol id="top5"></ol>
          <div class="mini-join"><div class="qr" id="qrMini"></div><div><div style="font-weight:700">מצטרפים מאוחר?</div><div class="c" id="codeMini"></div></div></div>
        </aside>
      </div>
    </section>

    <section id="t-final" hidden>
      <div class="final">
        <div>
          <h2 style="font-size:2.2rem;margin:0 0 1rem;text-align:center">🏆 הזוכים</h2>
          <div class="podium" id="podium"></div>
        </div>
        <div class="card summary" id="summary"></div>
      </div>
    </section>
  </main>
</div>
<script src="qr.js"></script>
<script src="teacher.js"></script>
</body>
</html>
