<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<title>שליח הדחף – משחק הנוירון</title>
<meta name="description" content="משחק כיתתי על מבנה הנוירון ותפקידו: בונים נוירון, שולחים דחף עצבי ובודקים מה קורה כשהמיאלין פגוע.">
<meta property="og:title" content="שליח הדחף – משחק הנוירון">
<meta property="og:description" content="בונים נוירון, שולחים מסר, ובודקים מה קורה כשהמיאלין פגוע.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="preload" href="fonts/Rubik.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="s-wrap">
  <header class="s-top">
    <div class="brand"><span class="logo" aria-hidden="true">⚡</span><span>שליח הדחף</span></div>
    <div class="chip-pts" id="ptsChip" hidden><span id="whoName"></span> · <span id="ptsVal">0</span> נק׳</div>
  </header>
  <main id="app">
    <!-- JOIN -->
    <section class="screen" id="scr-join">
      <div class="hero center">
        <div class="big-emoji" aria-hidden="true">🧠⚡💪</div>
        <h1>שליח הדחף</h1>
        <p>משחק הנוירון של הכיתה</p>
      </div>
      <form class="card" id="joinForm" novalidate>
        <label class="lbl" for="code">קוד הכיתה</label>
        <input class="field code-input" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0000" required>
        <label class="lbl" for="name">השם הפרטי שלך</label>
        <input class="field" id="name" maxlength="14" autocomplete="given-name" placeholder="למשל: נועה" required>
        <p class="err" id="joinErr" role="alert"></p>
        <button class="btn wide" type="submit" id="joinBtn">הצטרפות למשחק</button>
      </form>
      <p class="small-link muted">מורה? <a href="teacher.html">אני המורה</a></p>
    </section>

    <!-- WAIT -->
    <section class="screen center" id="scr-wait" hidden>
      <div class="big-emoji" aria-hidden="true">👋</div>
      <h1 style="margin:.2rem 0">שלום <span id="waitName"></span>!</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p style="font-size:1.4rem;font-weight:700;margin:0">מחכים למורה...</p>
      <p class="muted">ברגע שהמורה יתחיל, המשחק ייפתח כאן.</p>
    </section>

    <!-- INTRO -->
    <section class="screen" id="scr-intro" hidden>
      <div class="card intro center">
        <span class="stage-tag" id="introTag">שלב 1 מתוך 3</span>
        <div class="big-emoji" id="introEmoji" style="margin-top:.6rem">🧩</div>
        <h2 id="introTitle"></h2>
        <p id="introText"></p>
        <p id="introText2" class="muted" style="color:#5a6b85"></p>
        <button class="btn wide" id="introGo" style="margin-top:1rem">יאללה, מתחילים!</button>
      </div>
    </section>

    <!-- STAGE 1 -->
    <section class="screen play" id="scr-s1" hidden>
      <div class="bar"><span class="title">שלב 1: בנו את הנוירון</span><span class="meta" id="s1meta">0/5</span></div>
      <div class="neuron-box" id="neuronBox"></div>
      <div class="role idle" id="role" aria-live="polite">גררו כל חלק למקום שלו על הנוירון</div>
      <div class="tray" id="tray"></div>
    </section>

    <!-- STAGE 2/3 -->
    <section class="screen play" id="scr-run" hidden>
      <div class="bar"><span class="title" id="runTitle"></span><span class="meta" id="runMeta"></span></div>
      <div class="strength" id="strengthRow" hidden><span>עוצמת המסר</span><span class="track"><span class="fill" id="strengthFill"></span></span></div>
      <div class="route-box" id="routeBox"></div>
      <div class="status-line" id="runStatus" aria-live="polite"></div>
      <button class="btn tap" id="tapBtn" type="button">⚡ הקישו!</button>
    </section>

    <!-- STAGE RESULT -->
    <section class="screen" id="scr-res" hidden>
      <div class="card center" id="resCard"></div>
    </section>

    <!-- END -->
    <section class="screen" id="scr-end" hidden>
      <div class="card center">
        <div class="big-emoji" aria-hidden="true">🏁</div>
        <h2 style="margin:.3rem 0" id="endTitle">כל הכבוד!</h2>
        <div class="stars" id="endStars" aria-label=""></div>
        <p class="score-big" id="endScore">0</p>
        <p style="margin:0 0 .8rem;font-weight:700">נקודות</p>
        <div id="endCompare"></div>
        <p style="font-size:1.35rem;font-weight:800;margin:1rem 0 0">חכו לסיכום על הלוח 👀</p>
      </div>
    </section>
  </main>
</div>
<script src="student.js"></script>
</body>
</html>
